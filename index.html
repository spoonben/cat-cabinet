<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Cat Cabinet Improv</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow-x: hidden;
    }

    .site-title {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(1.25rem, 5vw, 3rem);
      color: #ff9933;
      text-shadow:
        3px 3px 0 #5c3d1e,
        4px 4px 0 #2a2a2a;
      letter-spacing: 0.1rem;
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
      text-align: center;
      word-break: break-word;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .site-title .accent {
      color: #ffb366;
    }

    .instagram-link:hover {
      text-decoration: underline;
      color: #ffcc99;
    }

    .instagram-link:hover .instagram-icon {
      fill: #ffcc99;
    }

    .instagram-icon {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
      fill: #ffb366;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .signup {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 26rem;
      text-align: center;
    }

    .signup-title {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.7rem, 2.5vw, 0.95rem);
      color: #ffb366;
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .signup-blurb {
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      opacity: 0.75;
      margin-bottom: 1rem;
    }

    .signup-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .signup-input {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.7rem 0.8rem;
      background: rgba(18, 18, 32, 0.6);
      border: 2px solid #5c3d1e;
      color: #fff;
      font-family: inherit;
      /* 1rem keeps iOS Safari from zooming in when the field is focused */
      font-size: 1rem;
    }

    .signup-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .signup-input:focus {
      outline: none;
      border-color: #ff9933;
      box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.25);
    }

    .signup-button {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      color: #2a2a2a;
      background: #ff9933;
      border: none;
      padding: 0.85rem 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 #5c3d1e;
    }

    .signup-button:hover:not(:disabled) {
      background: #ffb366;
    }

    .signup-button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #5c3d1e;
    }

    .signup-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .signup-status {
      min-height: 1.5rem;
      margin-top: 0.75rem;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
    }

    .signup-status[data-state="ok"] {
      color: #9ae6b4;
    }

    .signup-status[data-state="error"] {
      color: #ffa3a3;
    }

    .signup-privacy {
      font-size: 0.7rem;
      opacity: 0.5;
    }

    footer {
      margin-top: 1.5rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1 class="site-title">Cat <span class="accent">Cabinet</span></h1>
  <img src="cc.png" alt="Cat Cabinet Improv" class="logo" width="100%"/>
  <section>
    <a
      class="instagram-link"
      href="https://www.instagram.com/catcabinetimprov/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.218 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.14-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
    </a>
  </section>

  <section class="signup">
    <h2 class="signup-title">Never miss a show</h2>
    <p class="signup-blurb">Show announcements and nonsense, straight to your inbox.</p>

    <form
      class="signup-form"
      id="signup-form"
      method="POST"
      action="https://assets.mailerlite.com/jsonp/2575033/forms/195731514780026449/subscribe"
    >
      <label class="visually-hidden" for="signup-email">Email address</label>
      <input
        class="signup-input"
        id="signup-email"
        type="email"
        name="fields[email]"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >
      <input type="hidden" name="ml-submit" value="1">
      <input type="hidden" name="anticsrf" value="true">
      <button class="signup-button" id="signup-button" type="submit">Sign up</button>
    </form>

    <p class="signup-status" id="signup-status" role="status" aria-live="polite"></p>
    <p class="signup-privacy">No spam. Unsubscribe any time.</p>
  </section>

  <footer></footer>

  <script>
    (function () {
      var form = document.getElementById('signup-form');
      var button = document.getElementById('signup-button');
      var status = document.getElementById('signup-status');
      if (form === null || button === null || status === null) return;

      function setStatus(state, message) {
        status.dataset.state = state;
        status.textContent = message;
      }

      // Distinguishes messages safe to show a visitor from raw browser/network
      // errors like "Failed to fetch", which should stay behind a generic message.
      function userError(message) {
        var error = new Error(message);
        error.userFacing = true;
        return error;
      }

      function firstFieldError(payload) {
        var fields = payload && payload.errors && payload.errors.fields;
        if (!fields) return null;
        var names = Object.keys(fields);
        for (var i = 0; i < names.length; i++) {
          var messages = fields[names[i]];
          if (Array.isArray(messages) && typeof messages[0] === 'string') {
            return messages[0];
          }
        }
        return null;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        button.disabled = true;
        setStatus('pending', 'Signing you up\u2026');

        fetch(form.action, { method: 'POST', body: new FormData(form) })
          .then(function (response) {
            // The endpoint allows 10 requests per minute per client.
            if (response.status === 429) {
              throw userError('Too many tries. Wait a minute, then try again.');
            }
            return response.json();
          })
          .then(function (payload) {
            if (payload.success === true) {
              form.reset();
              setStatus('ok', 'Almost there \u2014 check your email to confirm.');
              return;
            }
            throw userError(firstFieldError(payload) || 'That address was not accepted. Please check it and try again.');
          })
          .catch(function (error) {
            setStatus('error', error.userFacing === true
              ? error.message
              : 'Could not reach the signup service. Please try again.');
          })
          .finally(function () {
            button.disabled = false;
          });
      });
    })();
  </script>

</body>
</html>
